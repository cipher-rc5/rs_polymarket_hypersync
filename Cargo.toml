[package]
name = "rs_polymarket_hypersync"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

# This manifest is intentionally annotated by subsystem so maintainers and
# coding agents can quickly map crates to runtime responsibilities.
[dependencies]
# Error handling and environment bootstrapping
anyhow = "1.0.104"
dotenvy = "0.15.7"

# Storage and analytics output
arrow = { version = "59.1", default-features = false, features = ["ipc"] }
duckdb = { version = "1.10505.0", features = ["bundled"] }
parquet = { version = "59.1", default-features = false, features = ["arrow", "zstd"] }

# HyperSync ingestion
hypersync-client = "1.4.0"

# RTDS/WebSocket transport and HTTP stack
fastwebsockets = { version = "0.10.0", features = ["upgrade"] }
http-body-util = "0.1.4"
hyper = "1.11.0"
hyper-util = "0.1.20"

# TLS and integrity helpers
native-tls = "0.2.18"
sha2 = "0.11.0"
tokio-native-tls = "0.3.1"

# Data decoding, API clients, and async runtime
num-bigint = "0.5.1"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.54", features = ["formatting"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
